<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription - IndiaGovWatch Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --saffron: #FF6B1A;
      --saffron-light: #FF8C42;
      --green-india: #138808;
      --navy: #0B1426;
      --navy-mid: #112240;
      --navy-card: #162B4D;
      --navy-border: #1E3A5F;
      --white: #F8F4EF;
      --text-body: #C5D0E0;
      --error: #EF4444;
      --success: #10B981;
      --gold: #E8C547;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 260px;
      background: var(--navy-mid);
      border-right: 1px solid var(--navy-border);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      text-decoration: none;
      color: var(--white);
    }

    .ashoka {
      width: 32px;
      height: 32px;
      background: conic-gradient(from 0deg, var(--saffron), #E8C547, var(--green-india), var(--saffron));
      border-radius: 50%;
      animation: spin 20s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .sidebar-logo span {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 900;
    }

    .sidebar-logo span em {
      color: var(--saffron);
      font-style: normal;
    }

    .nav-menu { flex: 1; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 4px;
      border-radius: 8px;
      color: var(--text-body);
      text-decoration: none;
      font-size: 15px;
      transition: all 0.2s;
    }

    .nav-item:hover {
      background: var(--navy-card);
      color: var(--white);
    }

    .nav-item.active {
      background: var(--saffron);
      color: white;
    }

    .nav-item .icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }

    .user-section {
      border-top: 1px solid var(--navy-border);
      padding-top: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      background: var(--saffron);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    .user-details h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .user-details p {
      font-size: 12px;
      color: var(--text-body);
    }

    .logout-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--navy-border);
      border-radius: 6px;
      color: var(--text-body);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      border-color: var(--error);
      color: var(--error);
    }

    /* Main Content */
    .main-content {
      margin-left: 260px;
      padding: 32px 40px;
      max-width: 1000px;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .page-header p {
      color: var(--text-body);
      font-size: 15px;
    }

    /* Current Plan Card */
    .current-plan {
      background: var(--navy-card);
      border: 1px solid var(--navy-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .current-plan .plan-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .current-plan .plan-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .current-plan .plan-status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .plan-status.trial {
      background: rgba(232, 197, 71, 0.2);
      color: var(--gold);
    }

    .plan-status.active {
      background: rgba(19, 136, 8, 0.2);
      color: var(--green-india);
    }

    .plan-status.expired {
      background: rgba(239, 68, 68, 0.2);
      color: var(--error);
    }

    .current-plan .plan-details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .plan-detail {
      padding: 16px;
      background: var(--navy-mid);
      border-radius: 8px;
    }

    .plan-detail .label {
      font-size: 12px;
      color: var(--text-body);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .plan-detail .value {
      font-size: 16px;
      font-weight: 600;
    }

    /* Plans Grid */
    .plans-section h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .plans-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .plan-card {
      background: var(--navy-card);
      border: 2px solid var(--navy-border);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.2s;
    }

    .plan-card:hover {
      border-color: var(--saffron);
      transform: translateY(-2px);
    }

    .plan-card.current {
      border-color: var(--green-india);
    }

    .plan-card.recommended {
      border-color: var(--saffron);
    }

    .plan-card .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .plan-card .badge.current-badge {
      background: rgba(19, 136, 8, 0.2);
      color: var(--green-india);
    }

    .plan-card .badge.recommended-badge {
      background: rgba(255, 107, 26, 0.2);
      color: var(--saffron);
    }

    .plan-card h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .plan-card .price {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .plan-card .price span {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-body);
    }

    .plan-card .description {
      color: var(--text-body);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .plan-card .features {
      list-style: none;
      margin-bottom: 24px;
    }

    .plan-card .features li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--text-body);
    }

    .plan-card .features li::before {
      content: '✓';
      color: var(--green-india);
      font-weight: bold;
    }

    .plan-card .select-btn {
      width: 100%;
      padding: 12px;
      background: var(--saffron);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .plan-card .select-btn:hover {
      background: var(--saffron-light);
    }

    .plan-card .select-btn.current-btn {
      background: var(--green-india);
      cursor: default;
    }

    .plan-card .select-btn:disabled {
      background: #555;
      cursor: not-allowed;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-body);
    }

    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid var(--navy-border);
      border-radius: 50%;
      border-top-color: var(--saffron);
      animation: spin 0.8s linear infinite;
    }

    @media (max-width: 1024px) {
      .plans-grid {
        grid-template-columns: 1fr;
      }
      .current-plan .plan-details {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
      }
      .main-content {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="/" class="sidebar-logo">
      <div class="ashoka"></div>
      <span>India<em>Gov</em>Watch</span>
    </a>

    <nav class="nav-menu">
      <a href="/dashboard/home.html" class="nav-item">
        <span class="icon">🏠</span>
        Dashboard
      </a>
      <a href="/dashboard/preferences.html" class="nav-item">
        <span class="icon">⚙️</span>
        Preferences
      </a>
      <a href="/dashboard/subscription.html" class="nav-item active">
        <span class="icon">💳</span>
        Subscription
      </a>
    </nav>

    <div class="user-section">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">U</div>
        <div class="user-details">
          <h4 id="userName">User</h4>
          <p id="userEmail">email@example.com</p>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header">
      <h1>Subscription</h1>
      <p>Manage your plan and billing</p>
    </div>

    <div id="subscriptionContent">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading subscription details...</p>
      </div>
    </div>
  </main>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    const API_BASE = '/api';
    let currentSubscription = null;

    document.addEventListener('DOMContentLoaded', () => {
      // Check authentication
      const token = localStorage.getItem('igw_token');
      if (!token) {
        window.location.href = '/dashboard/';
        return;
      }

      // Load user data
      const user = JSON.parse(localStorage.getItem('igw_user') || '{}');
      if (user.name) {
        document.getElementById('userName').textContent = user.name;
        document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
      }
      if (user.email) {
        document.getElementById('userEmail').textContent = user.email;
      }

      // Load subscription
      loadSubscription();

      // Logout handler
      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('igw_token');
        localStorage.removeItem('igw_user');
        localStorage.removeItem('igw_subscription');
        window.location.href = '/dashboard/';
      });
    });

    async function loadSubscription() {
      const token = localStorage.getItem('igw_token');
      const container = document.getElementById('subscriptionContent');

      try {
        const response = await fetch(`${API_BASE}/user/subscription`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const data = await response.json();

        if (response.ok && data.success) {
          currentSubscription = data.subscription;
          renderSubscriptionPage(data);
        } else {
          container.innerHTML = `<div class="loading"><p>Failed to load subscription. Please try again.</p></div>`;
        }
      } catch (error) {
        console.error('Error loading subscription:', error);
        container.innerHTML = `<div class="loading"><p>Network error. Please check your connection.</p></div>`;
      }
    }

    function renderSubscriptionPage(data) {
      const container = document.getElementById('subscriptionContent');
      const sub = data.subscription;

      let statusClass = 'trial';
      let statusText = 'Trial';
      if (sub) {
        if (sub.status === 'active') {
          statusClass = 'active';
          statusText = 'Active';
        } else if (sub.status === 'expired' || sub.status === 'cancelled') {
          statusClass = 'expired';
          statusText = sub.status.charAt(0).toUpperCase() + sub.status.slice(1);
        }
      }

      const plans = [
        {
          id: 'bharat',
          name: 'Bharat Plan',
          price: '₹99',
          period: '/month',
          description: 'For individuals tracking government updates',
          features: [
            'Daily digests in Hindi & English',
            'Government schemes & jobs alerts',
            'State-specific updates',
            'Email support'
          ]
        },
        {
          id: 'pro',
          name: 'Pro Plan',
          price: '₹299',
          period: '/month',
          description: 'For professionals & NRIs',
          features: [
            'Everything in Bharat',
            'RTI updates & policy analysis',
            'Tender & procurement alerts',
            'Custom keyword alerts',
            'Priority support'
          ],
          recommended: true
        },
        {
          id: 'global',
          name: 'Global Plan',
          price: '$9',
          period: '/month',
          description: 'For international users',
          features: [
            'Everything in Pro',
            'Global timezone support',
            'International policy updates',
            'API access',
            'Dedicated support'
          ]
        }
      ];

      const currentPlan = sub ? sub.plan : null;

      container.innerHTML = `
        <!-- Current Plan -->
        ${sub ? `
        <div class="current-plan">
          <div class="plan-header">
            <div>
              <div class="plan-name">${sub.planDetails?.name || 'Unknown Plan'}</div>
              <span class="plan-status ${statusClass}">${statusText}</span>
            </div>
          </div>
          <div class="plan-details">
            <div class="plan-detail">
              <div class="label">Plan Type</div>
              <div class="value">${sub.plan?.charAt(0).toUpperCase() + sub.plan?.slice(1) || 'N/A'}</div>
            </div>
            <div class="plan-detail">
              <div class="label">${sub.status === 'trial' ? 'Trial Ends' : 'Renews On'}</div>
              <div class="value">${formatDate(sub.status === 'trial' ? sub.trialEnd : sub.endDate)}</div>
            </div>
            <div class="plan-detail">
              <div class="label">${sub.statusDetails?.isActive ? 'Days Remaining' : 'Status'}</div>
              <div class="value">${sub.statusDetails?.isActive ? sub.statusDetails.daysRemaining + ' days' : 'Expired'}</div>
            </div>
          </div>
        </div>
        ` : `
        <div class="current-plan">
          <div class="plan-header">
            <div>
              <div class="plan-name">No Active Subscription</div>
              <span class="plan-status expired">Inactive</span>
            </div>
          </div>
          <p style="color: var(--text-body);">Choose a plan below to start receiving government updates.</p>
        </div>
        `}

        <!-- Available Plans -->
        <div class="plans-section">
          <h2>${sub?.statusDetails?.isActive ? 'Change Plan' : 'Choose a Plan'}</h2>
          <div class="plans-grid">
            ${plans.map(plan => `
              <div class="plan-card ${plan.id === currentPlan ? 'current' : ''} ${plan.recommended ? 'recommended' : ''}">
                ${plan.id === currentPlan ? '<span class="badge current-badge">Current Plan</span>' :
                  plan.recommended ? '<span class="badge recommended-badge">Recommended</span>' : ''}
                <h3>${plan.name}</h3>
                <div class="price">${plan.price}<span>${plan.period}</span></div>
                <p class="description">${plan.description}</p>
                <ul class="features">
                  ${plan.features.map(f => `<li>${f}</li>`).join('')}
                </ul>
                <button class="select-btn ${plan.id === currentPlan && sub?.statusDetails?.isActive ? 'current-btn' : ''}"
                        onclick="selectPlan('${plan.id}')"
                        ${plan.id === currentPlan && sub?.statusDetails?.isActive ? 'disabled' : ''}>
                  ${plan.id === currentPlan && sub?.statusDetails?.isActive ? 'Current Plan' :
                    sub?.statusDetails?.isActive ? 'Switch Plan' : 'Subscribe'}
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    async function selectPlan(planId) {
      const user = JSON.parse(localStorage.getItem('igw_user') || '{}');

      try {
        // Create order
        const response = await fetch('/api/create-order', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            userId: user.id,
            plan: planId,
            userEmail: user.email,
            userName: user.name
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          alert(data.error || 'Failed to create order');
          return;
        }

        // Open Razorpay checkout
        const options = {
          key: data.data.key_id,
          amount: data.data.amount,
          currency: data.data.currency,
          name: 'IndiaGovWatch',
          description: `${planId.charAt(0).toUpperCase() + planId.slice(1)} Plan Subscription`,
          order_id: data.data.order_id,
          prefill: {
            name: user.name,
            email: user.email
          },
          theme: {
            color: '#FF6B1A'
          },
          handler: async function(response) {
            // Verify payment
            const verifyResponse = await fetch('/api/verify-payment', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature
              })
            });

            const verifyData = await verifyResponse.json();

            if (verifyData.success) {
              // Update local storage
              localStorage.setItem('igw_subscription', JSON.stringify({
                plan: planId,
                status: 'active'
              }));

              alert('Payment successful! Your subscription is now active.');
              window.location.reload();
            } else {
              alert('Payment verification failed. Please contact support.');
            }
          }
        };

        const razorpay = new Razorpay(options);
        razorpay.open();

      } catch (error) {
        console.error('Error selecting plan:', error);
        alert('An error occurred. Please try again.');
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      return new Date(dateStr).toLocaleDateString('en-IN', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    }
  </script>
</body>
</html>
